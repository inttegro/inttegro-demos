[project]
name = "inttegro-django-demo"
version = "1.8.3"
description = "An async Inttegro hosted-checkout demo for Django"
requires-python = ">=3.13"
dependencies = [
  "django==6.1.3",
  "inttegro==14.1.1",
  "whitenoise==6.12.0",
  "workers-py>=1.17.1",
  "workers-runtime-sdk",
]

[dependency-groups]
dev = [
  "uvicorn[standard]==0.54.0",
]
