[project]
name = "inttegro-fastapi-demo"
version = "1.8.3"
description = "An async Inttegro hosted-checkout demo for FastAPI"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.162.2",
  "inttegro==14.1.1",
  "jinja2==3.1.6",
  "markupsafe==3.0.2",
  "python-multipart==0.0.33",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "uvicorn[standard]==0.54.0",
  "workers-py>=1.17.1",
  "workers-runtime-sdk",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
